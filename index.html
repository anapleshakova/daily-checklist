<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Daily Journal</title>
<style>
  :root{
    --bg:#F3EEE4; --paper:#FBF8F1; --paperDeep:#F6F1E7; --ink:#2B2A24; --inkSoft:#6F685A;
    --line:#E2D9C8; --mood:#5E7050; --anx:#B5784F; --energy:#C2A05A; --sleep:#7C90A0; --flag:#9A4A3C;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 130px;}
  header{padding:30px 0 16px;}
  .kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--inkSoft);margin-bottom:6px;}
  h1{font-family:var(--serif);font-weight:500;font-size:33px;line-height:1.05;margin:0;letter-spacing:-.5px;}
  h1 span{color:var(--mood);}
  .subline{color:var(--inkSoft);font-size:14px;margin:8px 0 0;}
  .card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;animation:rise .35s ease both;}
  .label{font-family:var(--serif);font-size:18px;font-weight:500;}
  .sub{font-size:13px;color:var(--inkSoft);margin-top:3px;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .seg{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .seg button{flex:1 1 auto;min-width:60px;padding:11px 10px;border-radius:11px;cursor:pointer;font-family:inherit;
    font-size:14px;border:1.5px solid var(--line);background:transparent;color:var(--inkSoft);transition:all .15s;}
  .seg button.on{color:#fff;font-weight:600;}

  .pills{display:flex;gap:8px;}
  .pills button{flex:1;padding:9px;border-radius:99px;border:1.5px solid var(--line);background:transparent;
    color:var(--inkSoft);font-family:inherit;font-size:13px;cursor:pointer;transition:all .15s;}
  .pills button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .slider{margin-bottom:20px;}
  .slider:last-child{margin-bottom:0;}
  .slrow{display:flex;justify-content:space-between;align-items:baseline;}
  .slrow .name{font-size:15px;font-weight:500;}
  .slrow .val{font-family:var(--serif);font-size:22px;}
  .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--inkSoft);margin-top:2px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;margin-top:9px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#FBF8F1;border:3px solid currentColor;cursor:pointer;box-shadow:0 2px 6px rgba(43,42,36,.18);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#FBF8F1;border:3px solid currentColor;cursor:pointer;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .chip{border:1.5px solid var(--line);background:transparent;color:var(--inkSoft);padding:8px 13px;border-radius:99px;
    font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .chip.on{background:var(--anx);border-color:var(--anx);color:#fff;}

  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--paperDeep);
    font-size:20px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .stepper .num{font-family:var(--serif);font-size:28px;min-width:46px;text-align:center;}

  textarea,input[type=text],input[type=date]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;
    font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--paperDeep);line-height:1.5;}
  textarea{margin-top:10px;resize:vertical;}
  textarea:focus,input:focus{outline:none;}

  .primary{width:100%;padding:16px;border-radius:14px;border:none;background:var(--ink);color:var(--bg);
    font-family:var(--serif);font-size:17px;font-weight:500;cursor:pointer;letter-spacing:.2px;}
  .ghost{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);
    font-family:var(--serif);font-size:15px;cursor:pointer;margin-top:10px;}
  .danger{color:var(--flag);border-color:#E7D2CB;}

  .row{display:flex;gap:12px;margin-bottom:14px;}
  .stat{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px;}
  .stat .t{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--inkSoft);}
  .stat .v{font-family:var(--serif);font-size:30px;font-weight:500;margin-top:4px;line-height:1;}
  .stat .s{font-size:12px;color:var(--inkSoft);margin-top:4px;}

  .seflist{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .sebar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .sebar-track{height:8px;background:var(--paperDeep);border-radius:99px;overflow:hidden;}
  .sebar-fill{height:100%;background:var(--anx);border-radius:99px;}

  pre.report{white-space:pre-wrap;font-family:var(--sans);font-size:14px;line-height:1.65;color:var(--ink);
    margin-top:16px;background:var(--paperDeep);padding:16px;border-radius:12px;}

  .nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding-bottom:18px;}
  .navinner{pointer-events:auto;display:flex;gap:2px;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;
    padding:5px;box-shadow:0 8px 28px rgba(43,42,36,.14);}
  .navinner button{padding:10px 16px;border-radius:99px;border:none;cursor:pointer;font-family:var(--serif);font-size:14.5px;
    background:transparent;color:var(--inkSoft);transition:all .2s;}
  .navinner button.on{background:var(--ink);color:var(--bg);}

  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--mood);color:#fff;font-size:12.5px;
    padding:7px 16px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}

  .legend{display:flex;gap:16px;margin-top:10px;justify-content:center;font-size:12px;color:var(--inkSoft);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:16px;height:0;display:inline-block;}

  .checkrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;cursor:pointer;
    font-family:inherit;text-align:left;padding:0;}
  .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--inkSoft);flex-shrink:0;display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:14px;}
  .note-support{margin-top:14px;font-size:13.5px;line-height:1.5;background:#FBF3F0;padding:14px;border-radius:12px;}
  .empty{text-align:center;padding:36px;font-family:var(--serif);font-size:20px;color:var(--inkSoft);line-height:1.4;}
  .tinynote{font-size:12.5px;color:var(--inkSoft);text-align:center;line-height:1.5;padding:0 10px;margin-top:6px;}

  .logrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .logrow:last-child{border-bottom:none;}
  .logdot{width:9px;height:9px;border-radius:99px;flex-shrink:0;}
  .logdate{font-size:14px;font-weight:500;min-width:74px;}
  .logmeta{font-size:12.5px;color:var(--inkSoft);}
  .mk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .mk:last-child{border-bottom:none;}
  .mk button{background:none;border:none;color:var(--flag);font-size:18px;cursor:pointer;padding:4px 8px;}
  .editbanner{font-size:13px;color:var(--anx);background:#F6ECE2;border:1px solid #EAD9C6;border-radius:12px;
    padding:11px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .editbanner a{color:var(--ink);text-decoration:underline;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Daily journal</div>
    <h1 id="hTitle">How today <span>went</span></h1>
    <p class="subline" id="hSub"></p>
  </header>
  <div id="view"></div>
</div>

<div class="nav"><div class="navinner" id="nav"></div></div>
<div class="toast" id="toast">saved &#10003;</div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
/* ---------------- storage ---------------- */
var KEY = "daily-journal-v1";
var state = { settings:{}, entries:{}, markers:[] };
var tab = "today";
var editKey = null;          // which day the editor is on
var trendRange = "30";       // "30" | "90" | "all"
var reportScope = "all";     // "all" | "30" | "marker"

function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw) state = JSON.parse(raw); }
  catch(e){ console.warn("load failed", e); }
  if(!state.settings) state.settings={};
  if(!state.entries) state.entries={};
  if(!state.markers) state.markers=[];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); toast("saved \u2713"); }
  catch(e){ toast("couldn't auto-save \u2014 use Backup"); }
}
var toastT;
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },1700); }

/* ---------------- date helpers ---------------- */
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return fmt(new Date()); }
function pretty(k){ var p=k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2])
  .toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function short(k){ var p=k.split("-").map(Number); return p[1]+"/"+p[2]; }
function cutoffKey(days){ var d=new Date(); d.setDate(d.getDate()-(days-1)); return fmt(d); }
function blank(){ return { routine:null, mood:5, anxiety:5, energy:5, sleepHours:7, sleepQuality:5,
  notes:[], drinks:null, lowDay:false, note:"" }; }

var TAGS = ["Nausea","Dizziness","Drowsy in day","Dry mouth","Sweating","Headache",
  "Restless / wired","Appetite off","Woke at night","Stomach / gut","Low libido"];

/* ---------------- working draft ---------------- */
var draft = null;
function loadDraft(){ var k=editKey||todayKey(); draft = state.entries[k] ? JSON.parse(JSON.stringify(state.entries[k])) : blank(); }

/* ---------------- stats ---------------- */
function allKeys(){ return Object.keys(state.entries).sort(); }
function keysInWindow(range){
  var ks=allKeys();
  if(range==="all") return ks;
  if(range==="marker"){ var m=lastMarkerDate(); if(!m) return ks; return ks.filter(function(k){return k>=m;}); }
  var c=cutoffKey(Number(range)); return ks.filter(function(k){return k>=c;});
}
function lastMarkerDate(){ if(!state.markers.length) return null;
  var past=state.markers.map(function(m){return m.date;}).filter(function(d){return d<=todayKey();}).sort();
  return past.length?past[past.length-1]:state.markers.map(function(m){return m.date;}).sort()[0]; }

function statsFor(keys){
  var ordered=keys.slice().sort(); var n=ordered.length;
  if(n===0) return { n:0, ordered:[] };
  var vals=ordered.map(function(k){return state.entries[k];});
  var mean=function(a){ return a.length ? +(a.reduce(function(x,y){return x+y;},0)/a.length).toFixed(1) : 0; };
  var avg={ mood:mean(vals.map(function(v){return v.mood;})),
            anxiety:mean(vals.map(function(v){return v.anxiety;})),
            energy:mean(vals.map(function(v){return v.energy;})) };
  var avgSleep=mean(vals.map(function(v){return Number(v.sleepHours);}));
  var slice=Math.max(1,Math.floor(n/3));
  var firstM=function(sel){return mean(vals.slice(0,slice).map(sel));};
  var lastM=function(sel){return mean(vals.slice(n-slice).map(sel));};
  var tr=function(sel){return +(lastM(sel)-firstM(sel)).toFixed(1);};
  var trend={ mood:tr(function(v){return v.mood;}), anxiety:tr(function(v){return v.anxiety;}), energy:tr(function(v){return v.energy;}) };
  var doneDays=vals.filter(function(v){return v.routine==="done";}).length;
  var missedDays=ordered.filter(function(k){return state.entries[k].routine==="missed";});
  var tagCount={};
  vals.forEach(function(v){ (v.notes||[]).forEach(function(s){ tagCount[s]=(tagCount[s]||0)+1; }); });
  var tagRanked=Object.keys(tagCount).map(function(k){return [k,tagCount[k]];}).sort(function(a,b){return b[1]-a[1];});
  var earlyT=vals.slice(0,slice).reduce(function(a,v){return a+((v.notes||[]).length);},0)/slice;
  var recentT=vals.slice(n-slice).reduce(function(a,v){return a+((v.notes||[]).length);},0)/slice;
  var tagDir=+(recentT-earlyT).toFixed(1);
  var lowDays=ordered.filter(function(k){return state.entries[k].lowDay;});
  var drinkDays=vals.filter(function(v){return v.drinks&&v.drinks!=="none";}).length;
  return { n:n, ordered:ordered, avg:avg, avgSleep:avgSleep, trend:trend, doneDays:doneDays,
    missedDays:missedDays, tagRanked:tagRanked, tagDir:tagDir, lowDays:lowDays, drinkDays:drinkDays };
}

/* ---------------- charts ---------------- */
function lineChart(stats){
  var W=320,H=200,pad=24, n=stats.n;
  var xs=function(i){ return n===1 ? W/2 : pad + i*(W-2*pad)/(n-1); };
  var ys=function(v){ return H-pad - (v/10)*(H-2*pad); };
  function path(sel){ var d=""; stats.ordered.forEach(function(k,i){
      var v=sel(state.entries[k]); d+=(i===0?"M":"L")+xs(i).toFixed(1)+" "+ys(v).toFixed(1)+" "; }); return d; }
  var grid="";
  [0,5,10].forEach(function(g){ var y=ys(g); grid+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="var(--line)"/>'
    +'<text x="2" y="'+(y+3)+'" font-size="9" fill="var(--inkSoft)">'+g+'</text>'; });
  var mk="", first=stats.ordered[0], last=stats.ordered[n-1];
  (state.markers||[]).forEach(function(m){
    if(m.date<first||m.date>last) return;
    var idx=0,found=false; for(var i=0;i<n;i++){ if(stats.ordered[i]>=m.date){idx=i;found=true;break;} }
    if(!found) idx=n-1; var x=xs(idx);
    mk+='<line x1="'+x.toFixed(1)+'" y1="'+pad+'" x2="'+x.toFixed(1)+'" y2="'+(H-pad)+'" stroke="#2B2A24" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>';
    mk+='<circle cx="'+x.toFixed(1)+'" cy="'+(pad+2)+'" r="4.5" fill="#2B2A24" opacity="0.65"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">'+grid+mk
    +'<path d="'+path(function(v){return v.mood;})+'" fill="none" stroke="var(--mood)" stroke-width="2.5"/>'
    +'<path d="'+path(function(v){return v.anxiety;})+'" fill="none" stroke="var(--anx)" stroke-width="2.5"/>'
    +'<path d="'+path(function(v){return v.energy;})+'" fill="none" stroke="var(--energy)" stroke-width="2" stroke-dasharray="4 3"/>'
    +'</svg>';
}
function sleepChart(stats){
  var W=320,H=150,pad=22, n=stats.n, max=12;
  var bw=Math.min(26,Math.max(3,(W-2*pad)/n*0.7));
  var ys=function(v){ return H-pad - (v/max)*(H-2*pad); };
  var bars="";
  stats.ordered.forEach(function(k,i){
    var v=Math.min(max,Number(state.entries[k].sleepHours));
    var x=(n===1?W/2:pad+i*(W-2*pad)/(n-1))-bw/2;
    var h=(H-pad)-ys(v);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+ys(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="2" fill="var(--sleep)"/>';
  });
  var ref=ys(7);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)"/>'
    +'<line x1="'+pad+'" y1="'+ref+'" x2="'+(W-pad)+'" y2="'+ref+'" stroke="var(--inkSoft)" stroke-dasharray="3 3"/>'
    +'<text x="2" y="'+(ref+3)+'" font-size="9" fill="var(--inkSoft)">7h</text>'+bars+'</svg>';
}

/* ---------------- render ---------------- */
function render(){
  var c=allKeys().length;
  document.getElementById("hSub").textContent = c===0 ? "Your first entry starts the record."
    : c+" day"+(c>1?"s":"")+" logged \u00b7 saved on this device";
  var v=document.getElementById("view");
  if(tab==="today") v.innerHTML=editorView();
  else if(tab==="trends") v.innerHTML=trendsView();
  else if(tab==="log") v.innerHTML=logView();
  else v.innerHTML=reportView();
  renderNav();
}

/* ---------------- editor ---------------- */
function editorView(){
  var k=editKey||todayKey(); var isToday=(k===todayKey()); var done=!!state.entries[k]; var d=draft;
  var h="";
  if(!isToday) h+='<div class="editbanner"><span>Editing '+pretty(k)+'</span><a onclick="go(\'today\')">Back to today</a></div>';
  if(done) h+='<div class="card" style="border-color:var(--mood);background:#EEF1E8;"><div style="display:flex;align-items:center;gap:10px;">'
    +'<span style="width:10px;height:10px;border-radius:99px;background:var(--mood);display:inline-block;flex-shrink:0;"></span>'
    +'<div style="font-size:14px;"><strong>'+pretty(k)+'</strong> is saved. Adjust anything and re-save.</div></div></div>';

  h+='<div class="card"><div class="label">Daily routine</div>'
    +'<div class="sub">Your morning thing \u2014 done, not yet, or skipped.</div>'+seg("routine",[
    {v:"done",l:"Done \u2713",c:"var(--mood)"},{v:"not_yet",l:"Not yet",c:"var(--energy)"},{v:"missed",l:"Skipped",c:"var(--flag)"}],d.routine)+'</div>';

  h+='<div class="card">'
    +slider("mood","Mood","low","bright",d.mood,"var(--mood)")
    +slider("anxiety","Anxiety","calm","on edge",d.anxiety,"var(--anx)")
    +slider("energy","Energy","drained","lively",d.energy,"var(--energy)")+'</div>';

  h+='<div class="card"><div class="label">Sleep</div>'
    +'<div style="display:flex;align-items:center;gap:14px;margin:12px 0 18px;">'
    +'<div class="stepper"><button onclick="stepSleep(-0.5)">\u2013</button>'
    +'<span class="num" id="sleepNum">'+d.sleepHours+'</span><button onclick="stepSleep(0.5)">+</button></div>'
    +'<span style="color:var(--inkSoft);font-size:14px;">hours</span></div>'
    +slider("sleepQuality","Sleep quality","restless","deep",d.sleepQuality,"var(--sleep)")+'</div>';

  h+='<div class="card"><div class="label">How my body felt</div>'
    +'<div class="sub">Tap anything you noticed \u2014 leaving it blank is a good sign.</div><div class="chips">';
  TAGS.forEach(function(s){ h+='<button class="chip'+(d.notes.indexOf(s)>=0?" on":"")+'" onclick="toggleTag(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</button>'; });
  h+='</div></div>';

  h+='<div class="card"><div class="label">Drinks</div>'+seg("drinks",[
    {v:"none",l:"None"},{v:"1",l:"1"},{v:"2",l:"2"},{v:"3+",l:"3+"}],d.drinks)+'</div>';

  h+='<div class="card" id="flagCard" style="'+(d.lowDay?"border-color:var(--flag);background:#F3E7E3;":"")+'">'
    +'<button class="checkrow" onclick="toggleFlag()">'
    +'<span class="checkbox" style="'+(d.lowDay?"border-color:var(--flag);background:var(--flag);":"")+'">'+(d.lowDay?"\u2713":"")+'</span>'
    +'<span style="font-size:14.5px;color:var(--ink);">This was a really heavy, low day worth flagging</span></button>'
    +(d.lowDay?'<div class="note-support">Thank you for being honest with yourself \u2014 noting it matters. '
      +'Please don\u2019t carry a day like this alone. Reaching out to someone you trust, or a professional, is worth doing today. '
      +'If things feel urgent or overwhelming, contact your local emergency services or a crisis line right away. '
      +'You deserve support now, not later.</div>':'')+'</div>';

  h+='<div class="card"><div class="label">A line about the day</div>'
    +'<textarea rows="3" id="noteBox" placeholder="What helped, what was hard, the hike, how you slept\u2026" '
    +'oninput="draft.note=this.value">'+escapeHtml(d.note)+'</textarea></div>';

  h+='<button class="primary" onclick="submitDay()">'+(done?"Update "+(isToday?"today":"this day"):"Save "+(isToday?"today":"this day"))+'</button>';
  if(done) h+='<button class="ghost danger" onclick="deleteDay()">Delete this day</button>';
  return h;
}

function seg(field,opts,cur){
  var h='<div class="seg">';
  opts.forEach(function(o){ var on=cur===o.v; var col=o.c||"var(--ink)";
    h+='<button class="'+(on?"on":"")+'" style="'+(on?("background:"+col+";border-color:"+col+";"):"")+'" '
      +'onclick="setField(\''+field+'\',\''+o.v+'\')">'+o.l+'</button>'; });
  return h+'</div>';
}
function slider(field,name,lo,hi,val,col){
  var pct=(val-1)/9*100;
  return '<div class="slider" style="color:'+col+'"><div class="slrow"><span class="name" style="color:var(--ink)">'+name+'</span>'
    +'<span class="val" id="val_'+field+'" style="color:'+col+'">'+val+'</span></div>'
    +'<input type="range" min="1" max="10" value="'+val+'" '
    +'style="background:linear-gradient(90deg,'+col+' '+pct+'%,var(--line) '+pct+'%);color:'+col+'" '
    +'oninput="setSlider(\''+field+'\',this)"/>'
    +'<div class="ends"><span>'+lo+'</span><span>'+hi+'</span></div></div>';
}

/* ---------------- marker legend ---------------- */
function markerLegend(stats){
  if(!state.markers||!state.markers.length||!stats.ordered||!stats.ordered.length) return "";
  var first=stats.ordered[0], last=stats.ordered[stats.ordered.length-1];
  var visible=state.markers.filter(function(m){ return m.date>=first&&m.date<=last; })
    .sort(function(a,b){ return a.date<b.date?-1:1; });
  if(!visible.length) return "";
  return '<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px;">'
    +visible.map(function(m){
      return '<div style="display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--inkSoft);">'
        +'<span style="width:10px;height:10px;border-radius:99px;background:#2B2A24;opacity:0.6;flex-shrink:0;"></span>'
        +'<span><strong style="color:var(--ink)">'+short(m.date)+'</strong>'
        +(m.label?' \u2014 '+escapeHtml(m.label):'')+'</span></div>';
    }).join("")+'</div>';
}

/* ---------------- trends ---------------- */
function trendsView(){
  var s=statsFor(keysInWindow(trendRange));
  var h='<div class="card"><div class="pills">'
    +rangeBtn("30","30 days")+rangeBtn("90","90 days")+rangeBtn("all","All")+'</div></div>';
  if(s.n===0) return h+'<div class="card"><div class="empty">No entries in this window yet \u2014 add a day and the picture grows here.</div></div>';
  var arrowMood=arrow(s.trend.mood,"up"), arrowAnx=arrow(s.trend.anxiety,"down");
  h+='<div class="row">'+statBox("Routine",s.doneDays+"/"+s.n,"days done","var(--mood)","")
    +statBox("Avg sleep",s.avgSleep,"hours / night","var(--sleep)","")+'</div>';
  h+='<div class="row">'+statBox("Mood",s.avg.mood,trendTxt(s.trend.mood),"var(--mood)",arrowMood)
    +statBox("Anxiety",s.avg.anxiety,trendTxt(s.trend.anxiety),"var(--anx)",arrowAnx)+'</div>';

  h+='<div class="card"><div class="label">Mood \u00b7 anxiety \u00b7 energy</div>'
    +'<div class="sub">1\u201310 daily \u2014 dark dots mark your saved dates.</div>'
    +lineChart(s)
    +'<div class="legend"><span><i style="border-top:2.5px solid var(--mood)"></i>Mood</span>'
    +'<span><i style="border-top:2.5px solid var(--anx)"></i>Anxiety</span>'
    +'<span><i style="border-top:2.5px dashed var(--energy)"></i>Energy</span></div>'
    +markerLegend(s)+'</div>';

  h+='<div class="card"><div class="label">Sleep</div>'+sleepChart(s)+'</div>';

  h+='<div class="card"><div class="label">How the body felt</div>'
    +'<div class="sub">How often each showed up in this window.</div>';
  if(s.tagRanked.length===0) h+='<p style="color:var(--mood);font-size:14px;margin-top:12px;">Nothing logged \u2014 encouraging.</p>';
  else { h+='<div class="seflist">'; s.tagRanked.forEach(function(r){
      h+='<div><div class="sebar-top"><span>'+r[0]+'</span><span style="color:var(--inkSoft)">'+r[1]+' day'+(r[1]>1?"s":"")+'</span></div>'
        +'<div class="sebar-track"><div class="sebar-fill" style="width:'+(r[1]/s.n*100)+'%"></div></div></div>'; });
    h+='</div>'; }
  h+='</div>';

  if(s.lowDays.length>0) h+='<div class="card" style="border-color:var(--flag);background:#F5EAE6;"><div class="label">Flagged days</div>'
    +'<p style="font-size:13.5px;line-height:1.5;margin-top:8px;">'+s.lowDays.length+' heavy day'
    +(s.lowDays.length>1?"s":"")+' in this window: '+s.lowDays.map(pretty).join(", ")+'. Worth bringing up \u2014 and reaching out sooner if it\u2019s ongoing.</p></div>';
  return h;
}
function rangeBtn(v,l){ return '<button class="'+(trendRange===v?"on":"")+'" onclick="setRange(\''+v+'\')">'+l+'</button>'; }
function setRange(v){ trendRange=v; render(); }

function statBox(t,v,s,col,arr){
  return '<div class="stat"><div class="t">'+t+'</div><div class="v" style="color:'+col+'">'+v+' '+arr+'</div><div class="s">'+s+'</div></div>';
}
function arrow(v,good){ if(v===0) return ""; var rising=v>0; var glyph=rising?"\u2191":"\u2193";
  var isGood=(good==="up"&&rising)||(good==="down"&&!rising); var col=isGood?"var(--mood)":"var(--anx)";
  return '<span style="font-size:18px;color:'+col+'">'+glyph+'</span>'; }
function trendTxt(v){ return v===0?"steady in window":(Math.abs(v)+" pts "+(v>0?"higher":"lower")+" vs window start"); }

/* ---------------- log / history ---------------- */
function logView(){
  var ks=allKeys().reverse();
  if(ks.length===0) return '<div class="card"><div class="empty">No days logged yet.</div></div>';
  var routineColor={done:"var(--mood)",not_yet:"var(--energy)",missed:"var(--flag)"};
  var h='<div class="card"><div class="label">Your days</div><div class="sub">Tap any day to view or edit it.</div><div style="margin-top:8px;">';
  ks.forEach(function(k){ var e=state.entries[k]; var col=routineColor[e.routine]||"var(--line)";
    var meta="M"+e.mood+" \u00b7 A"+e.anxiety+" \u00b7 E"+e.energy;
    if((e.notes||[]).length) meta+=" \u00b7 "+e.notes.length+" note"+(e.notes.length>1?"s":"");
    if(e.lowDay) meta+=" \u00b7 \u2691";
    h+='<div class="logrow" onclick="openEntry(\''+k+'\')"><span class="logdot" style="background:'+col+'"></span>'
      +'<span class="logdate">'+short(k)+'</span><span class="logmeta">'+meta+'</span></div>'; });
  h+='</div></div>';
  return h;
}
function openEntry(k){ editKey=k; tab="today"; loadDraft(); window.scrollTo({top:0}); render(); }

/* ---------------- summary ---------------- */
function reportView(){
  var keys=keysInWindow(reportScope);
  var s=statsFor(keys);
  var h='<div class="card"><div class="label">Summary window</div><div class="pills" style="margin-top:12px;">'
    +scopeBtn("all","All")+scopeBtn("30","Last 30d")
    +(state.markers.length?scopeBtn("marker","Since marker"):"")+'</div></div>';
  if(s.n===0){ h+='<div class="card"><div class="empty">No entries in this window yet.</div></div>'; return h+markerCard(); }
  var text=buildReport(s);
  h+='<div class="card"><div class="label">Summary</div>'
    +'<div class="sub">A clean overview to show or copy. '+pretty(s.ordered[0])+' \u2192 '+pretty(s.ordered[s.ordered.length-1])+'.</div>'
    +'<pre class="report" id="reportText">'+escapeHtml(text)+'</pre>'
    +'<button class="primary" onclick="copyReport()">Copy summary</button></div>';
  h+=markerCard();
  h+='<div class="card"><div class="label">Backup</div>'
    +'<div class="sub">Your entries live on this device. Download a backup now and then \u2014 your safety net.</div>'
    +'<button class="ghost" onclick="exportData()">\u2b07 Download backup file</button>'
    +'<button class="ghost" onclick="document.getElementById(\'importFile\').click()">\u2b06 Restore from backup</button></div>';
  h+='<p class="tinynote">A personal record to help you keep track \u2014 it doesn\u2019t replace professional advice.</p>';
  return h;
}
function scopeBtn(v,l){ return '<button class="'+(reportScope===v?"on":"")+'" onclick="setScope(\''+v+'\')">'+l+'</button>'; }
function setScope(v){ reportScope=v; render(); }

function markerCard(){
  var h='<div class="card"><div class="label">Markers</div>'
    +'<div class="sub">Mark a date \u2014 an appointment, or a day something changed. Shows on the chart.</div>';
  if(state.markers.length){ h+='<div style="margin-top:12px;">';
    state.markers.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(m,i){
      h+='<div class="mk"><span style="font-size:13.5px;">'+pretty(m.date)+(m.label?' \u2014 '+escapeHtml(m.label):'')
        +'</span><button onclick="removeMarker(\''+m.date+'\',\''+escapeAttr(m.label)+'\')">\u00d7</button></div>'; });
    h+='</div>'; }
  h+='<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">'
    +'<input type="date" id="mkDate" value="'+todayKey()+'" />'
    +'<input type="text" id="mkLabel" placeholder="label (e.g. appointment, routine changed)" />'
    +'<button class="ghost" onclick="addMarker()">Add marker</button></div></div>';
  return h;
}
function addMarker(){ var d=document.getElementById("mkDate").value; var l=document.getElementById("mkLabel").value.trim();
  if(!d){ toast("pick a date"); return; }
  state.markers.push({date:d,label:l}); save(); render(); }
function removeMarker(date,label){ state.markers=state.markers.filter(function(m){return !(m.date===date&&(m.label||"")===(label||""));}); save(); render(); }

function buildReport(s){
  var L=[];
  L.push("Daily log \u2014 personal summary");
  L.push("Period: "+pretty(s.ordered[0])+" to "+pretty(s.ordered[s.ordered.length-1])+" ("+s.n+" days)");
  L.push("");
  L.push("Routine done: "+s.doneDays+" of "+s.n+" days"+(s.missedDays.length?("; skipped "+s.missedDays.length+" ("+s.missedDays.map(short).join(", ")+")"):"")+".");
  L.push("");
  L.push("Mood: avg "+s.avg.mood+"/10 ("+dir(s.trend.mood)+" "+Math.abs(s.trend.mood)+" across window).");
  L.push("Anxiety: avg "+s.avg.anxiety+"/10 ("+dir(s.trend.anxiety)+" "+Math.abs(s.trend.anxiety)+").");
  L.push("Energy: avg "+s.avg.energy+"/10 ("+dir(s.trend.energy)+" "+Math.abs(s.trend.energy)+").");
  L.push("Sleep: avg "+s.avgSleep+" h/night.");
  L.push("");
  if(s.tagRanked.length){ L.push("Body notes (days): "+s.tagRanked.map(function(r){return r[0]+" \u00d7"+r[1];}).join(", ")+".");
    L.push("These are "+(s.tagDir<0?"decreasing":s.tagDir>0?"increasing":"steady")+" across the window."); }
  else L.push("Body notes: none.");
  L.push("");
  L.push("Drinks on "+s.drinkDays+" day(s).");
  if(s.lowDays.length) L.push("Flagged heavy days: "+s.lowDays.length+" ("+s.lowDays.map(short).join(", ")+").");
  else L.push("No flagged days.");
  if(state.markers.length){ L.push(""); L.push("Markers: "+state.markers.slice().sort(function(a,b){return a.date<b.date?-1:1;})
    .map(function(m){return short(m.date)+(m.label?" ("+m.label+")":"");}).join(", ")+"."); }
  return L.join("\n");
}
function dir(v){ return v>0?"up":v<0?"down":"flat"; }

/* ---------------- interactions ---------------- */
function setField(f,v){ draft[f]=(draft[f]===v?null:v); render(); }
function setSlider(f,el){ draft[f]=Number(el.value);
  var lbl=document.getElementById("val_"+f); if(lbl) lbl.textContent=el.value;
  var pct=(el.value-1)/9*100; el.style.background="linear-gradient(90deg,"+el.style.color+" "+pct+"%,var(--line) "+pct+"%)"; }
function stepSleep(delta){ draft.sleepHours=Math.max(0,Math.min(14,+(Number(draft.sleepHours)+delta).toFixed(1)));
  document.getElementById("sleepNum").textContent=draft.sleepHours; }
function toggleTag(s){ var i=draft.notes.indexOf(s); if(i>=0) draft.notes.splice(i,1); else draft.notes.push(s); render(); }
function toggleFlag(){ draft.lowDay=!draft.lowDay; render(); }
function submitDay(){ var k=editKey||todayKey(); state.entries[k]=JSON.parse(JSON.stringify(draft)); save();
  window.scrollTo({top:0,behavior:"smooth"}); render(); }
function deleteDay(){ var k=editKey||todayKey(); if(state.entries[k]){ delete state.entries[k]; save(); }
  editKey=todayKey(); loadDraft(); render(); toast("day removed"); }

function copyReport(){ var el=document.getElementById("reportText"); if(!el) return; var txt=el.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast("copied \u2713");},fallbackCopy.bind(null,txt)); }
  else fallbackCopy(txt); }
function fallbackCopy(txt){ var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy");toast("copied \u2713");}catch(e){toast("select & copy manually");} document.body.removeChild(ta); }

function exportData(){ var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a");
  a.href=url; a.download="journal-backup-"+todayKey()+".json"; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url); toast("backup downloaded \u2713"); }
document.getElementById("importFile").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var data=JSON.parse(r.result);
    if(data&&data.entries){ state=data; if(!state.settings)state.settings={}; if(!state.markers)state.markers=[];
      save(); editKey=todayKey(); loadDraft(); render(); toast("backup restored \u2713"); }
    else toast("that file didn\u2019t look right"); }catch(err){ toast("couldn\u2019t read that file"); } };
  r.readAsText(f); e.target.value=""; });

function renderNav(){ var tabs=[["today","Entry"],["trends","Trends"],["log","Log"],["report","Summary"]];
  document.getElementById("nav").innerHTML=tabs.map(function(t){
    return '<button class="'+(tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'; }).join(""); }
function go(t){ tab=t; if(t==="today"){ editKey=todayKey(); loadDraft(); } window.scrollTo({top:0}); render(); }

function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeAttr(s){ return (s||"").replace(/'/g,"\\'").replace(/"/g,"&quot;"); }

/* ---------------- boot ---------------- */
load(); editKey=todayKey(); loadDraft(); render();
</script>
</body>
</html>
